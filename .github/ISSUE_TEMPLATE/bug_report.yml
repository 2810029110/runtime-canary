name: Bug report
description: Report a reproducible Runtime Canary failure.
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Runtime Canary version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
      placeholder: Windows 11, Node.js 22.18.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npm run canary -- test --runtime fake
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Remove credentials and secrets before submitting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
